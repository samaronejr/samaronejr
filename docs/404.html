<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found — Samarone Fialho Lima</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/styles.css">
    <style>
      .error-page{display:grid;min-height:100svh;place-items:center;padding:2rem;text-align:center;background:radial-gradient(circle at 50% 30%,rgba(var(--accent-rgb),.12),transparent 28rem),var(--bg)}
      .error-page main{max-width:46rem}.error-code{margin:0;color:var(--accent);font-family:var(--font-mono);font-size:.8rem;letter-spacing:.12em}.error-page h1{margin:1rem 0;font-size:clamp(3.5rem,10vw,7rem);line-height:.95}.error-page p{margin:0 auto 2rem;color:var(--muted-strong)}
    </style>
  </head>
  <body>
    <div class="error-page">
      <main>
        <p class="error-code">ERROR / 404</p>
        <h1>Signal not found.</h1>
        <p>The page you requested is outside this project’s current observation window.</p>
        <a class="button button-primary" href="./">Return to the portfolio</a>
      </main>
    </div>
  </body>
</html>
